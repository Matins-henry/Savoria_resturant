<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Accent -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" />

  <!-- Culinary Crest Group -->
  <g id="culinary-emblem" transform="translate(0, 10)">
    <!-- Aroma / Steam swirls above -->
    <path d="M 230 115 Q 220 95 230 75 Q 240 55 230 40" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.85" />
    <path d="M 256 105 Q 270 85 256 65 Q 245 45 256 30" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.95" />
    <path d="M 282 115 Q 292 95 282 75 Q 272 55 282 40" fill="none" stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.85" />

    <!-- Chef Hat / Cloche Finial Knob -->
    <ellipse cx="256" cy="140" rx="14" ry="10" fill="url(#goldGrad)" />
    
    <!-- Fine Dining Cloche Dome -->
    <path d="M 145 270 C 145 165, 367 165, 367 270 Z" fill="#ffffff" />
    
    <!-- Dome Shadow / Contrast Arc -->
    <path d="M 175 260 C 190 195, 322 195, 337 260 C 295 240, 215 240, 175 260 Z" fill="url(#goldGrad)" opacity="0.35" />

    <!-- Cloche Rim Base Tray -->
    <rect x="125" y="270" width="262" height="18" rx="9" fill="url(#goldGrad)" filter="url(#softGlow)" />
    <rect x="115" y="284" width="282" height="10" rx="5" fill="#ffffff" />

    <!-- Crossed Gourmet Dining Cutlery -->
    <!-- Fork (Diagonal Left to Right) -->
    <g transform="translate(256, 355) rotate(-35) translate(-256, -355)">
      <!-- Fork Handle -->
      <path d="M 252 320 L 252 420 C 252 428 260 428 260 420 L 260 320 Z" fill="#ffffff" />
      <circle cx="256" cy="425" r="7" fill="url(#goldGrad)" />
      <!-- Fork Head -->
      <path d="M 245 320 C 245 300 267 300 267 320 Z" fill="#ffffff" />
      <!-- Tines -->
      <line x1="247" y1="285" x2="247" y2="305" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="253" y1="282" x2="253" y2="305" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="259" y1="282" x2="259" y2="305" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <line x1="265" y1="285" x2="265" y2="305" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Knife (Diagonal Right to Left) -->
    <g transform="translate(256, 355) rotate(35) translate(-256, -355)">
      <!-- Knife Handle -->
      <path d="M 252 320 L 252 420 C 252 428 260 428 260 420 L 260 320 Z" fill="#ffffff" />
      <circle cx="256" cy="425" r="7" fill="url(#goldGrad)" />
      <!-- Knife Blade -->
      <path d="M 252 320 L 252 280 C 252 275 264 285 264 305 L 260 320 Z" fill="#ffffff" />
    </g>

    <!-- Central Sparkle / Star of Excellence -->
    <g transform="translate(256, 355)">
      <circle cx="0" cy="0" r="14" fill="#991b1b" stroke="url(#goldGrad)" stroke-width="3" />
      <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="#fef08a" />
    </g>
  </g>
</svg>
